<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Muzik</title>
  <link rel="icon" type="image/png" href="./assets/crest-teal-480.png">
  <link rel="preload" as="font" type="font/woff2" href="./assets/fonts/archivo-latin-var.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="./assets/fonts/bungee-latin-400.woff2" crossorigin>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/shell.css">
  <link rel="stylesheet" href="./styles/eq.css">
  <link rel="stylesheet" href="./styles/run.css">
  <link rel="stylesheet" href="./styles/review.css">
  <link rel="stylesheet" href="./styles/settings.css">
</head>
<body>
  <div class="shell">
    <header class="rail">
      <a class="brand" href="#/run">
        <span class="crest">
          <img class="crest-mark" src="./assets/crest-outline-480.png" alt="Clean Muzik" width="847" height="817">
        </span>
      </a>
      <p class="strap">Source in, tagged Tracks out</p>
      <nav class="nav" aria-label="Views">
        <a href="#/run" data-route="run">Run</a>
        <a href="#/review" data-route="review">Review <span class="badge" id="review-badge" hidden></span></a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <div class="onair is-idle" id="run-onair">
        <span class="onair-line">
          <span class="lamp" id="run-lamp" aria-hidden="true"></span>
          <span class="onair-word" id="run-state">Idle</span>
        </span>
        <span class="onair-source" id="run-source"></span>
      </div>
    </header>

    <main id="view" class="work"></main>

    <div class="horizon">
      <canvas id="eq" aria-hidden="true"></canvas>
      <div class="lower-third" id="now-downloading" hidden>
        <i class="lt-meter" aria-hidden="true"></i>
        <span class="lt-cap">Now downloading</span>
        <span class="lt-title"></span>
        <span class="lt-speed"></span>
        <span class="lt-pct"><b>0</b><i>%</i></span>
      </div>
    </div>
  </div>

  <script type="module">
    // Mock layer is opt-in via ?mock=1 and must be installed before any view
    // touches fetch/EventSource, hence the dynamic import gate here.
    if (new URLSearchParams(location.search).has("mock")) {
      await import("./dev-mock.js");
    }
    await import("./app.js");
  </script>
</body>
</html>
