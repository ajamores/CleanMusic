[project]
name = "muzik"
version = "0.1.0"
description = "Download audio from a YouTube Source and write verified music Tags into each Track."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "shazamio>=0.5",
    "pyacoustid>=1.3",
    "musicbrainzngs>=0.7.1",
    "anthropic>=0.40",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]

[project.scripts]
muzik = "muzik.cli:main"

[project.optional-dependencies]
dev = [
    # The default offline suite imports the web adapter (tests/test_web_api.py
    # needs fastapi's TestClient, which rides on httpx), so the documented
    # `.[dev]` install must carry both; uvicorn (serving only) stays in `web`.
    "fastapi>=0.110",
    "httpx>=0.27",
    "pytest>=8",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muzik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite is offline (docs/DEVELOPMENT.md). The `smoke` tests hit real
# yt-dlp + network and are deselected here; `pytest -m smoke` re-selects them (a
# command-line -m overrides this one). See tests/test_smoke_yt_dlp.py.
addopts = ["-m", "not smoke"]
markers = [
    "smoke: opt-in integration test against real yt-dlp/network (#30). Deselected by default; run with `pytest -m smoke`. Skips (never fails) when network / yt-dlp / ffmpeg / a JS runtime is unavailable.",
]
